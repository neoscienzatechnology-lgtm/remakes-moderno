    <script>
      // SPA redirect: GitHub Pages serves 404.html for unknown routes.
      // This restores the original path so the client-side router can handle it.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
